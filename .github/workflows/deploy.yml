name: Deploy

# Push to main → SSH into the droplet, pull the new code, rebuild the binary,
# and restart the service. The DB stays on Aiven and is never touched here.
on:
  push:
    branches: [main]
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  # Gate the deploy: the Go binary must compile, tests must pass, and every
  # browser JS module must parse. The JS check is what catches a broken import
  # (e.g. a bad template literal) that would kill app.js — go build can't see it.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test ./...
      - name: JS syntax check
        run: bash scripts/check-js.sh

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /srv/bosfoot
            git fetch origin main
            git reset --hard origin/main
            /usr/local/go/bin/go build -o bosfoot-app .
            sudo /usr/bin/systemctl restart bosfoot
            echo "Deployed $(git rev-parse --short HEAD)"
