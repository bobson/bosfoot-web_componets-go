root = "."
tmp_dir = "tmp/air"  # NOT "tmp": clean_on_exit wipes tmp_dir, and tmp/pg is the sandbox DB

[build]
  cmd = "go build -o ./tmp/air/main ./main.go"
  bin = "./tmp/air/main"
  include_ext = ["go", "html", "json", "css", "js"]
  exclude_dir = ["tmp", "vendor", "node_modules"]
  delay = 1000  # ms

[log]
  time = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
