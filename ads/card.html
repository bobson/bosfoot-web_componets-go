<!doctype html>
<!-- Ad card template, rendered to 1080x1080 PNG with headless Chromium:
     chromium --headless --screenshot=out.png --window-size=1080,1080 "card.html?bg=...&..."
     Text comes from query params so one template serves every card. -->
<html lang="mk">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Golos"; src: url("../public/fonts/GolosText-Regular.woff2"); font-weight: 400; }
  @font-face { font-family: "Golos"; src: url("../public/fonts/GolosText-Medium.woff2"); font-weight: 500; }
  @font-face { font-family: "Golos"; src: url("../public/fonts/GolosText-SemiBold.woff2"); font-weight: 600; }
  @font-face { font-family: "Golos"; src: url("../public/fonts/GolosText-Bold.woff2"); font-weight: 700; }
  :root {
    --forest: #4f5c23;
    --cream: #f5f1e9;
    --ink: #1a1a1a;
    --sale: #c52020;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; }
  body { font-family: "Golos", sans-serif; color: var(--ink); }
  .card { position: relative; width: 1080px; height: 1080px; background: center / cover no-repeat; }

  /* Soft cream fade behind the headline so dark text reads over the photo. */
  .top {
    position: absolute; inset: 0 0 auto 0; padding: 52px 64px 90px;
    background: linear-gradient(to bottom,
      rgb(245 241 233 / 0.88) 0%, rgb(245 241 233 / 0.62) 60%, rgb(245 241 233 / 0) 100%);
  }
  /* layout=right: headline block in the top-right corner (photo subject on the left). */
  .right .top {
    left: auto; width: 720px; padding: 52px 56px 140px 40px; text-align: right;
    background: radial-gradient(ellipse farthest-side at top right,
      rgb(245 241 233 / 0.92) 0%, rgb(245 241 233 / 0.8) 50%, rgb(245 241 233 / 0) 100%);
  }
  .right .headline { font-size: 50px; }
  .right .model { color: var(--ink); font-weight: 600; }
  .headline { font-size: 58px; font-weight: 700; text-shadow: 0 1px 12px rgb(245 241 233 / 0.7); line-height: 1.08; letter-spacing: -0.01em; }
  .model { margin-top: 16px; font-size: 30px; font-weight: 500; color: var(--forest); }

  .badge {
    position: absolute; top: 56px; right: 64px;
    background: var(--sale); color: #fff; font-weight: 700; font-size: 44px;
    padding: 10px 22px; border-radius: 16px;
  }

  /* Small price tag, bottom-left above the strip. */
  .tag {
    position: absolute; left: 48px; bottom: 112px;
    background: rgb(245 241 233 / 0.95); border-radius: 14px; padding: 14px 22px;
    box-shadow: 0 4px 18px rgb(0 0 0 / 0.18);
  }
  .price { font-size: 34px; font-weight: 700; color: var(--forest); line-height: 1.1; }
  .price s { font-size: 24px; font-weight: 500; color: #6b6b6b; margin-right: 10px; }
  .price.sale { color: var(--sale); }
  .sub { margin-top: 4px; font-size: 20px; font-weight: 500; color: #3a3a3a; }

  .strip {
    position: absolute; inset: auto 0 0 0; height: 84px; padding: 0 48px;
    background: var(--forest); color: var(--cream);
    display: flex; align-items: center; justify-content: space-between;
    font-size: 27px; font-weight: 600;
  }
  .strip .url { font-size: 22px; font-weight: 500; opacity: 0.9; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="top">
    <div class="headline" id="headline"></div>
    <div class="model" id="model"></div>
  </div>
  <div class="badge" id="badge" hidden></div>
  <div class="tag">
    <div class="price" id="price"></div>
    <div class="sub" id="sub"></div>
  </div>
  <div class="strip">
    <span>Бесплатна замена на број · Плаќање при испорака</span>
    <span class="url">bosfoot.com</span>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('card').style.backgroundImage = `url("${q.get('bg')}")`;
  if (q.get('layout') === 'right') document.getElementById('card').classList.add('right');
  document.getElementById('headline').innerHTML = (q.get('headline') || '').replace(/\|/g, '<br>');
  document.getElementById('model').textContent = q.get('model') || '';
  document.getElementById('sub').textContent = q.get('sub') || '';
  const price = document.getElementById('price');
  if (q.get('old')) {
    price.classList.add('sale');
    price.innerHTML = `<s>${q.get('old')}</s>${q.get('price')}`;
  } else {
    price.textContent = q.get('price') || '';
  }
  if (q.get('badge')) {
    const b = document.getElementById('badge');
    b.textContent = q.get('badge');
    b.hidden = false;
  }
</script>
</body>
</html>
